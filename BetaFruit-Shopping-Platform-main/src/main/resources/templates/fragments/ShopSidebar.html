<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Dùng: <aside th:replace="~{fragments/ShopSidebar :: shop-sidebar('orders')}"></aside>
  Các href hiện là placeholder để thay bằng route thực tế sau này.
-->
<aside class="shop-sidebar" th:fragment="shop-sidebar(active)" aria-label="Điều hướng quản lý cửa hàng">
    <a class="shop-sidebar__brand" href="#" aria-label="BetaFruit">
        <span class="shop-sidebar__logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7.2c-1.1-1.6-3-2.4-4.8-2.1-2.5.4-4.1 2.9-3.5 5.3.8 3.6 4.8 6.8 8.3 8.5 3.5-1.7 7.5-4.9 8.3-8.5.6-2.4-1-4.9-3.5-5.3-1.8-.3-3.7.5-4.8 2.1Z"/><path d="M12 7.2c.2-1.8 1.1-3 2.7-3.8"/></svg></span>
        <span>BetaFruit</span>
    </a>

    <nav class="shop-sidebar__nav">
        <a href="#" class="shop-sidebar__link" th:classappend="${active == 'overview'} ? ' shop-sidebar__link--active' : ''">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="3" height="8" rx="1"/><rect x="10.5" y="5" width="3" height="14" rx="1"/><rect x="17" y="8" width="3" height="11" rx="1"/></svg>
            <span>Tổng quan</span>
        </a>
        <a href="#" class="shop-sidebar__link" th:classappend="${active == 'products'} ? ' shop-sidebar__link--active' : ''">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5 12 4l7 4.5-7 4-7-4Z"/><path d="M5 8.5v7l7 4 7-4v-7"/><path d="M12 12.5v7"/></svg>
            <span>Sản phẩm</span>
        </a>
        <a href="#" class="shop-sidebar__link" th:classappend="${active == 'orders'} ? ' shop-sidebar__link--active' : ''">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10l1 12H6L7 7Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>
            <span>Đơn hàng</span>
        </a>
        <a href="#" class="shop-sidebar__link" th:classappend="${active == 'promotions'} ? ' shop-sidebar__link--active' : ''">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 8-8h6l2 2v6l-8 8L4 12Z"/><circle cx="15.5" cy="8.5" r="1.25"/></svg>
            <span>Khuyến mãi</span>
        </a>
        <a href="#" class="shop-sidebar__link" th:classappend="${active == 'revenue'} ? ' shop-sidebar__link--active' : ''">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l1 11H5L6 7Z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M12 10v5"/></svg>
            <span>Doanh thu</span>
        </a>
        <a href="#" class="shop-sidebar__link" th:classappend="${active == 'shop-info'} ? ' shop-sidebar__link--active' : ''">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14v9H5z"/><path d="M4 10 6 5h12l2 5"/><path d="M9 19v-5h6v5"/></svg>
            <span>Thông tin cửa hàng</span>
        </a>
    </nav>

    <div class="shop-sidebar__profile">
        <img th:src="${shopOwnerAvatar ?: 'https://ui-avatars.com/api/?name=Shop+Owner&amp;background=c8d8d4&amp;color=1b3546'}"
             src="https://ui-avatars.com/api/?name=Minh+Anh&amp;background=c8d8d4&amp;color=1b3546" alt="Ảnh đại diện chủ cửa hàng">
        <div>
            <strong th:text="${shopOwnerName ?: 'Minh Anh'}">Minh Anh</strong>
            <small>Quản trị viên</small>
        </div>
    </div>
</aside>

<style th:fragment="shop-sidebar-styles">
    .shop-sidebar { box-sizing: border-box; display: flex; flex-direction: column; width: 232px; min-height: 100vh; padding: 32px 18px 28px; background: #102e5a; color: #9eb4cf; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .shop-sidebar *, .shop-sidebar *::before, .shop-sidebar *::after { box-sizing: border-box; }
    .shop-sidebar__brand { display: inline-flex; align-items: center; gap: 10px; margin: 0 12px 39px; color: #eaf3ff; font-size: 17px; font-weight: 700; text-decoration: none; }
    .shop-sidebar__logo { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 8px; background: #3671ff; color: #fff; }
    .shop-sidebar__logo svg { width: 19px; height: 19px; fill: currentColor; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .shop-sidebar__nav { display: grid; gap: 5px; }
    .shop-sidebar__link { display: flex; align-items: center; gap: 15px; min-height: 42px; padding: 0 14px; border-radius: 9px; color: inherit; font-size: 14px; font-weight: 500; text-decoration: none; transition: background .18s ease, color .18s ease; }
    .shop-sidebar__link:hover { background: rgba(255,255,255,.08); color: #fff; }
    .shop-sidebar__link--active { background: #3671ff; box-shadow: 0 8px 18px rgba(22, 68, 172, .35); color: #fff; }
    .shop-sidebar__link svg { width: 15px; height: 15px; flex: 0 0 15px; fill: currentColor; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .shop-sidebar__link svg path, .shop-sidebar__link svg rect, .shop-sidebar__link svg circle { vector-effect: non-scaling-stroke; }
    .shop-sidebar__profile { display: flex; align-items: center; gap: 11px; margin-top: auto; padding: 24px 12px 0; border-top: 1px solid rgba(178, 201, 229, .16); }
    .shop-sidebar__profile img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .shop-sidebar__profile strong, .shop-sidebar__profile small { display: block; }
    .shop-sidebar__profile strong { color: #eaf3ff; font-size: 13px; line-height: 1.35; }
    .shop-sidebar__profile small { margin-top: 1px; color: #8da5c2; font-size: 11px; }
    @media (max-width: 700px) { .shop-sidebar { width: 72px; padding-inline: 10px; } .shop-sidebar__brand { margin-inline: 9px; } .shop-sidebar__brand > span:last-child, .shop-sidebar__link span, .shop-sidebar__profile > div { display: none; } .shop-sidebar__link { justify-content: center; padding: 0; } .shop-sidebar__profile { justify-content: center; padding-inline: 0; } }
</style>
</body>
</html>
