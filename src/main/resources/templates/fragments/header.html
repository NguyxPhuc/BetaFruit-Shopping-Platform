<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="header">
    <div class="header-accent" aria-hidden="true"></div>

    <nav class="navbar container" aria-label="Điều hướng chính">
        <a class="brand" th:href="@{/}" href="/" aria-label="BetaFruit - Trang chủ">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 48 48" role="img">
                    <path d="M25.2 14.4c1.5-6.3 5.7-9.8 12-10.2-.3 6.2-4.2 10.2-10.8 11.1"/>
                    <path d="M24 13.8C13.3 13.8 6.8 21 8.1 31.1 9.4 41.2 18.4 45 24 45s14.6-3.8 15.9-13.9C41.2 21 34.7 13.8 24 13.8Z"/>
                    <path class="brand-seed" d="M24 19.3c-1.4 3.3-1.4 6.6 0 9.9 1.4-3.3 1.4-6.6 0-9.9Z"/>
                </svg>
            </span>
            <span class="brand-name">Beta<span>Fruit</span></span>
        </a>

        <button class="menu-toggle" type="button" aria-expanded="false"
                aria-controls="primary-menu" aria-label="Mở menu"
                onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') !== 'true')">
            <span></span><span></span><span></span>
        </button>

        <div class="nav-content" id="primary-menu">
            <ul class="nav-links">
                <li><a th:href="@{/}" href="/">Trang chủ</a></li>
                <li><a th:href="@{/products}" href="/products">Sản phẩm</a></li>
                <li><a th:href="@{/shops}" href="/shops">Cửa hàng</a></li>
                <li><a th:href="@{/about}" href="/about">Về chúng tôi</a></li>
            </ul>

            <div class="nav-actions">
                <a class="icon-button" th:href="@{/search}" href="/search" aria-label="Tìm kiếm">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="m16 16 4 4"></path>
                    </svg>
                </a>
                <a class="icon-button cart-button" th:href="@{/cart}" href="/cart" aria-label="Giỏ hàng">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 4h2l2.2 10.1a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L20.5 8H6.1"></path>
                        <circle cx="9.5" cy="19.5" r="1"></circle>
                        <circle cx="17.5" cy="19.5" r="1"></circle>
                    </svg>
                    <span class="cart-count" th:text="${cartCount ?: 0}">0</span>
                </a>
                <a class="account-button" th:href="@{/login}" href="/login">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M5 20c.5-4 3.1-6 7-6s6.5 2 7 6"></path>
                    </svg>
                    <span>Đăng nhập</span>
                </a>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
