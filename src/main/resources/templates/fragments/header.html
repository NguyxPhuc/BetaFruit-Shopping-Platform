<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ════════════════════════════════════════════════════════════════════════
     1. CUSTOMER & GENERAL HEADER FRAGMENT (th:fragment="header")
     ════════════════════════════════════════════════════════════════════════ -->
<header class="site-header" th:fragment="header">
    <div class="header-accent" aria-hidden="true"></div>

    <nav class="navbar container" aria-label="Điều hướng chính">
        <a class="brand" th:href="@{/}" href="/" aria-label="BetaFruit - Trang chủ">
            <img class="brand-logo" th:src="@{/images/betafruit-logo.png}"
                 src="/images/betafruit-logo.png" alt="BetaFruit">
        </a>

        <button class="menu-toggle" type="button" aria-expanded="false"
                aria-controls="primary-menu" aria-label="Mở menu"
                onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') !== 'true')">
            <span></span><span></span><span></span>
        </button>

        <div class="nav-content" id="primary-menu">
            <ul class="nav-links">
                <li><a th:href="@{/}" href="/">Trang chủ</a></li>
                <li><a th:href="@{/products}" href="/products">Sản phẩm</a></li>
                <li><a th:href="@{/shops}" href="/shops">Cửa hàng</a></li>
                <li><a th:href="@{/about}" href="/about">Về chúng tôi</a></li>
            </ul>

            <div class="nav-actions">
                <a class="icon-button" th:href="@{/search}" href="/search" aria-label="Tìm kiếm">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="m16 16 4 4"></path>
                    </svg>
                </a>
                <a class="icon-button cart-button" th:href="@{/cart}" href="/cart" aria-label="Giỏ hàng">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 4h2l2.2 10.1a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L20.5 8H6.1"></path>
                        <circle cx="9.5" cy="19.5" r="1"></circle>
                        <circle cx="17.5" cy="19.5" r="1"></circle>
                    </svg>
                    <span class="cart-count" th:text="${cartCount ?: 0}">0</span>
                </a>

                <!-- ══════ QUẢ CHUÔNG THÔNG BÁO (KHI ĐÃ ĐĂNG NHẬP) ══════ -->
                <div th:if="${session.LOGGED_IN_USER_ID != null}"
                     class="notif-dropdown" id="notificationDropdown">
                    <button class="notif-button" type="button" aria-haspopup="true" aria-expanded="false"
                            aria-label="Thông báo"
                            onclick="toggleNotifDropdown(event)">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <!-- Số lượng thông báo chưa đọc (từ GlobalControllerAdvice) -->
                        <span class="notif-badge"
                              th:if="${globalUnreadCount != null && globalUnreadCount > 0}"
                              th:text="${globalUnreadCount > 99 ? '99+' : globalUnreadCount}">0</span>
                    </button>

                    <!-- Popover Dropdown Thông Báo -->
                    <div class="notif-menu" id="notifMenu" role="dialog" aria-label="Hộp thông báo">
                        <div class="notif-header">
                            <div class="notif-title-wrap">
                                <h3>Thông báo</h3>
                                <span class="notif-chip"
                                      th:if="${globalUnreadCount != null && globalUnreadCount > 0}"
                                      th:text="${globalUnreadCount} + ' mới'">3 mới</span>
                            </div>
                        </div>

                        <!-- Danh sách thông báo (cuộn scroll mượt mà) -->
                        <div class="notif-list" id="notifList">
                            <!-- Trường hợp chưa có thông báo nào -->
                            <div class="notif-empty" th:if="${globalRecentNotifs == null || globalRecentNotifs.empty}">
                                <svg viewBox="0 0 24 24">
                                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                </svg>
                                <p>Bạn chưa có thông báo nào mới</p>
                            </div>

                            <!-- Lặp qua NotificationResponse từ BE (5 thông báo gần nhất) -->
                            <a th:each="notif : ${globalRecentNotifs}"
                               class="notif-item"
                               th:classappend="${notif.isRead == false || notif.isRead == null ? 'is-unread' : ''}"
                               th:href="${notif.actionUrl != null && !notif.actionUrl.isEmpty() ? notif.actionUrl : '#'}"
                               href="#">
                                <div class="notif-icon-box">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                    </svg>
                                </div>
                                <div class="notif-content">
                                    <div class="notif-top">
                                        <div class="notif-item-title" th:text="${notif.title}">Cập nhật hệ thống</div>
                                        <span class="notif-time"
                                              th:text="${notif.createdAt != null ? #temporals.format(notif.createdAt, 'HH:mm dd/MM') : ''}">10:30</span>
                                    </div>
                                    <p class="notif-item-msg" th:text="${notif.message}">Nội dung thông báo...</p>
                                </div>
                                <span class="notif-unread-dot" th:if="${notif.isRead == false || notif.isRead == null}"></span>
                            </a>
                        </div>

                        <!-- Footer: Nút mở rộng xem tất cả & cuộn xuống -->
                        <div class="notif-footer" th:if="${globalRecentNotifs != null && !globalRecentNotifs.empty}">
                            <button type="button" class="btn-view-all-notifs" onclick="expandAllNotifications(event)">
                                <span>Xem tất cả thông báo</span>
                                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- TRƯỜNG HỢP 1: CHƯA ĐĂNG NHẬP -->
                <a th:if="${session.LOGGED_IN_USER_ID == null}"
                   class="account-button" th:href="@{/auth/login}" href="/auth/login">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M5 20c.5-4 3.1-6 7-6s6.5 2 7 6"></path>
                    </svg>
                    <span>Đăng nhập</span>
                </a>

                <!-- TRƯỜNG HỢP 2: ĐÃ ĐĂNG NHẬP THÀNH CÔNG (LẤY TỪ SESSION) -->
                <div th:if="${session.LOGGED_IN_USER_ID != null}"
                     class="user-dropdown" id="userAccountDropdown">
                    <button class="user-dropdown-btn" type="button" aria-haspopup="true" aria-expanded="false"
                            onclick="toggleUserDropdown(event)">
                        <span class="user-avatar-mini"
                              th:text="${session.LOGGED_IN_FULLNAME != null && !session.LOGGED_IN_FULLNAME.isEmpty() ? #strings.substring(session.LOGGED_IN_FULLNAME, 0, 1) : (session.LOGGED_IN_USERNAME != null ? #strings.substring(session.LOGGED_IN_USERNAME, 0, 1) : 'U')}">U</span>
                        <span class="user-display-name"
                              th:text="${session.LOGGED_IN_FULLNAME ?: session.LOGGED_IN_USERNAME ?: 'Tài khoản'}">Nguyễn Văn A</span>
                        <svg class="dropdown-chevron" viewBox="0 0 24 24" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>

                    <!-- Dropdown Menu (Dropbox) -->
                    <div class="user-dropdown-menu" role="menu">
                        <div class="dropdown-header">
                            <strong th:text="${session.LOGGED_IN_FULLNAME ?: session.LOGGED_IN_USERNAME ?: 'Khách hàng'}">Nguyễn Văn A</strong>
                            <span class="dropdown-sub" th:text="'@' + ${session.LOGGED_IN_USERNAME ?: 'user'}">@username</span>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" th:href="@{/profile}" href="/profile" role="menuitem">
                            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <span>Hồ sơ của tôi</span>
                        </a>
                        <a class="dropdown-item" th:href="@{/orders}" href="/orders" role="menuitem">
                            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                            <span>Đơn mua</span>
                        </a>
                        <a class="dropdown-item" th:href="@{/change-password}" href="/change-password" role="menuitem">
                            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <span>Đổi mật khẩu</span>
                        </a>

                        <!-- Nếu tài khoản có quyền ShopOwner thì hiển thị link chuyển sang Kênh Người Bán -->
                        <a th:if="${session.LOGGED_IN_ROLES != null && (#lists.contains(session.LOGGED_IN_ROLES, T(com.fu.SWP391_BetaFruit.enums.RoleName).SHOP_OWNER) || session.LOGGED_IN_ROLES.contains('ShopOwner') || session.LOGGED_IN_ROLES.contains('SHOP_OWNER'))}"
                           class="dropdown-item seller-switch" th:href="@{/shop/profile}" href="/shop/profile" role="menuitem">
                            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                            <span>Kênh người bán</span>
                        </a>

                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item logout-item" th:href="@{/auth/logout}" href="/auth/logout" role="menuitem">
                            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                            <span>Đăng xuất</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- ════════════════════════════════════════════════════════════════════════
     2. SHOP OWNER HEADER FRAGMENT (th:fragment="header-shop")
     Nhúng trực tiếp từ templates/shop/fragments/header.html (DRY)
     ════════════════════════════════════════════════════════════════════════ -->
<div th:fragment="header-shop" th:replace="~{shop/fragments/header :: header}"></div>

<!-- ════════════════════════════════════════════════════════════════════════
     JAVASCRIPT CHO NOTIFICATION & USER DROPDOWN
     ════════════════════════════════════════════════════════════════════════ -->
<script>
    function toggleNotifDropdown(e) {
        e.stopPropagation();
        const notifDropdown = document.getElementById('notificationDropdown');
        const userDropdown = document.getElementById('userAccountDropdown');
        if (userDropdown) userDropdown.classList.remove('is-open');
        if (notifDropdown) notifDropdown.classList.toggle('is-open');
    }

    function toggleUserDropdown(e) {
        e.stopPropagation();
        const userDropdown = document.getElementById('userAccountDropdown');
        const notifDropdown = document.getElementById('notificationDropdown');
        if (notifDropdown) notifDropdown.classList.remove('is-open');
        if (userDropdown) userDropdown.classList.toggle('is-open');
    }

    function expandAllNotifications(e) {
        e.stopPropagation();
        const notifMenu = document.getElementById('notifMenu');
        const notifList = document.getElementById('notifList');
        if (notifMenu) {
            notifMenu.classList.add('expanded');
        }
        if (notifList) {
            // Cuộn xuống để xem toàn bộ danh sách
            notifList.scrollTo({
                top: notifList.scrollHeight,
                behavior: 'smooth'
            });
        }
    }

    // Đóng dropdown khi click ra bên ngoài
    document.addEventListener('click', function(e) {
        const notifDropdown = document.getElementById('notificationDropdown');
        const userDropdown = document.getElementById('userAccountDropdown');
        if (notifDropdown && !notifDropdown.contains(e.target)) {
            notifDropdown.classList.remove('is-open');
        }
        if (userDropdown && !userDropdown.contains(e.target)) {
            userDropdown.classList.remove('is-open');
        }
    });
</script>

</body>
</html>
