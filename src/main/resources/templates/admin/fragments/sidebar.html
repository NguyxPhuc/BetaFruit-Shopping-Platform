<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="sidebar(activeMenu)" class="admin-sidebar">
    <!-- Brand Logo Section -->
    <div class="admin-sidebar-brand">
        <a th:href="@{/admin/shops}" href="/admin/shops" class="text-decoration-none d-block">
            <div class="admin-logo-wrapper">
                <img th:src="@{/images/betafruit-logo.png}" src="/images/betafruit-logo.png" alt="BetaFruit" class="admin-logo-img">
            </div>
        </a>
        <div class="d-flex align-items-center justify-content-between mt-2 px-1">
            <span class="badge bg-white-subtle text-white-50 border border-secondary-subtle" style="font-size: 0.68rem; letter-spacing: 0.5px;">ADMIN PANEL</span>
            <span class="small text-white-50" style="font-size: 0.7rem;">v1.0</span>
        </div>
    </div>

    <!-- Navigation Menu -->
    <div class="flex-grow-1 overflow-auto py-3">
        <!-- Dashboard Item -->
        <div class="admin-nav-category">Hệ thống</div>
        <ul class="admin-nav mb-3">
            <li class="admin-nav-item">
                <a th:href="@{/admin/dashboard}" href="/admin/dashboard" class="admin-nav-link"
                   th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">
                    <i class="bi bi-speedometer2"></i>
                    <span>Tổng quan (Dashboard)</span>
                </a>
            </li>
        </ul>

        <div class="admin-sidebar-divider"></div>

        <!-- Group 1: Phân quyền & Người dùng -->
        <div class="admin-nav-category">Tài khoản & Phân quyền</div>
        <ul class="admin-nav">
            <li class="admin-nav-item">
                <a th:href="@{/admin/roles}" href="/admin/roles" class="admin-nav-link"
                   th:classappend="${activeMenu == 'roles'} ? 'active' : ''">
                    <i class="bi bi-shield-lock-fill"></i>
                    <span>Quản lý Vai trò</span>
                </a>
            </li>
            <li class="admin-nav-item">
                <a th:href="@{/admin/users}" href="/admin/users" class="admin-nav-link"
                   th:classappend="${activeMenu == 'users'} ? 'active' : ''">
                    <i class="bi bi-people-fill"></i>
                    <span>Quản lý Người dùng</span>
                </a>
            </li>
        </ul>

        <div class="admin-sidebar-divider"></div>

        <!-- Group 2: Sản phẩm & Cửa hàng -->
        <div class="admin-nav-category">Sản phẩm & Cửa hàng</div>
        <ul class="admin-nav">
            <li class="admin-nav-item">
                <a th:href="@{/admin/categories}" href="/admin/categories" class="admin-nav-link"
                   th:classappend="${activeMenu == 'categories'} ? 'active' : ''">
                    <i class="bi bi-tags-fill"></i>
                    <span>Danh mục gốc</span>
                </a>
            </li>
            <li class="admin-nav-item">
                <a th:href="@{/admin/shops}" href="/admin/shops" class="admin-nav-link"
                   th:classappend="${activeMenu == 'shops'} ? 'active' : ''">
                    <i class="bi bi-shop"></i>
                    <span>Duyệt Cửa hàng</span>
                </a>
            </li>
            <li class="admin-nav-item">
                <a th:href="@{/admin/products}" href="/admin/products" class="admin-nav-link"
                   th:classappend="${activeMenu == 'products'} ? 'active' : ''">
                    <i class="bi bi-apple"></i>
                    <span>Duyệt & Ẩn Hoa quả</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Admin Account Card at bottom -->
    <div class="mt-auto border-top border-white-10">
        <div class="dropdown">
            <a href="#" class="admin-user-card dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="admin-avatar-circle">K</div>
                <div class="flex-grow-1 overflow-hidden">
                    <div class="fw-bold text-truncate" style="font-size: 0.875rem;">KhaiDQ</div>
                    <div class="text-white-50 small" style="font-size: 0.75rem;">Quản trị viên</div>
                </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                <li><a class="dropdown-item" th:href="@{/admin/roles}"><i class="bi bi-person me-2 text-success"></i>Hồ sơ Admin</a></li>
                <li><a class="dropdown-item" th:href="@{/}" target="_blank"><i class="bi bi-globe me-2 text-info"></i>Xem sàn khách</a></li>
                <li><hr class="dropdown-divider border-secondary"></li>
                <li><a class="dropdown-item text-danger" th:href="@{/auth/logout}" href="/"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
            </ul>
        </div>
    </div>
</div>
</html>
