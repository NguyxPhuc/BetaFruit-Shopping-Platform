<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="sidebar(activeMenu)" class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark shadow" style="width: 260px; min-height: 100vh;">
    <a href="/admin/roles" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
        <i class="bi bi-basket2-fill fs-3 text-warning me-2"></i>
        <span class="fs-4 fw-bold text-success">Beta<span class="text-warning">Fruit</span></span>
    </a>
    <hr class="border-secondary">
    
    <div class="px-2 py-1 mb-2 text-uppercase text-secondary small fw-semibold">Phân quyền & Tài khoản</div>
    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-1">
            <a href="/admin/roles" class="nav-link text-white d-flex align-items-center" 
               th:classappend="${activeMenu == 'roles'} ? 'active bg-success' : 'hover-item'">
                <i class="bi bi-shield-lock-fill me-2 fs-5"></i>
                <span>Quản lý Vai trò (Roles)</span>
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/admin/users" class="nav-link text-white d-flex align-items-center"
               th:classappend="${activeMenu == 'users'} ? 'active bg-success' : 'hover-item'">
                <i class="bi bi-people-fill me-2 fs-5"></i>
                <span>Quản lý Người dùng</span>
            </a>
        </li>
        
        <div class="px-2 py-1 mt-3 mb-2 text-uppercase text-secondary small fw-semibold">Quản lý Sản phẩm & Shop</div>
        <li class="nav-item mb-1">
            <a href="/admin/categories" class="nav-link text-white d-flex align-items-center"
               th:classappend="${activeMenu == 'categories'} ? 'active bg-success' : 'hover-item'">
                <i class="bi bi-tags-fill me-2 fs-5"></i>
                <span>Danh mục gốc (Categories)</span>
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/admin/shops" class="nav-link text-white d-flex align-items-center"
               th:classappend="${activeMenu == 'shops'} ? 'active bg-success' : 'hover-item'">
                <i class="bi bi-shop me-2 fs-5"></i>
                <span>Duyệt Cửa hàng (Shops)</span>
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/admin/products" class="nav-link text-white d-flex align-items-center"
               th:classappend="${activeMenu == 'products'} ? 'active bg-success' : 'hover-item'">
                <i class="bi bi-apple me-2 fs-5"></i>
                <span>Duyệt & Ẩn Hoa quả</span>
            </a>
        </li>
    </ul>
    
    <hr class="border-secondary">
    <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
            <div class="bg-success rounded-circle d-flex align-items-center justify-content-center me-2 text-white fw-bold" style="width: 34px; height: 34px;">K</div>
            <strong>KhaiDQ (Admin)</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
            <li><a class="dropdown-item" href="/admin/roles"><i class="bi bi-person me-2"></i>Hồ sơ</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="/"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
        </ul>
    </div>
</div>
</html>
