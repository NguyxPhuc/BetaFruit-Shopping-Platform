<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<!--
    REUSABLE PAGINATION COMPONENT FOR BETAFRUIT ADMIN
    Usage:
    <div th:replace="~{admin/fragments/pagination :: pager(pageData=${pageData}, baseUrl='/admin/users')}"></div>
-->
<div th:fragment="pager(pageData, baseUrl)" th:if="${pageData != null and pageData.totalElements > 0}"
     class="card-footer bg-white border-top py-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
    
    <!-- Left: Record summary info -->
    <div class="text-secondary small">
        Hiển thị 
        <span class="fw-bold text-dark" th:text="${pageData.number * pageData.size + 1}">1</span>
        đến 
        <span class="fw-bold text-dark" 
              th:text="${(pageData.number + 1) * pageData.size > pageData.totalElements ? pageData.totalElements : (pageData.number + 1) * pageData.size}">5</span>
        trong tổng số 
        <span class="badge bg-success-subtle text-success fw-bold px-2 py-1" th:text="${pageData.totalElements}">10</span> 
        bản ghi
    </div>

    <!-- Center/Right: Navigation buttons (Show if more than 1 page) -->
    <nav th:if="${pageData.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination pagination-sm mb-0 shadow-sm rounded">
            <!-- Nút về trang đầu (First) -->
            <li class="page-item" th:classappend="${pageData.first} ? 'disabled' : ''">
                <a class="page-link text-dark" 
                   th:href="@{${baseUrl}(page=1, size=${pageData.size}, keyword=${(keyword != null and !#strings.isEmpty(keyword)) ? keyword : null}, tab=${(currentTab != null and currentTab != 'ALL') ? currentTab : null}, status=${(currentStatus != null and currentStatus != 'ALL') ? currentStatus : null}, sortBy=${sortBy}, sortDir=${sortDir})}" 
                   title="Trang đầu">
                    <i class="bi bi-chevron-double-left"></i>
                </a>
            </li>

            <!-- Nút trang trước (Previous) -->
            <li class="page-item" th:classappend="${!pageData.hasPrevious()} ? 'disabled' : ''">
                <a class="page-link text-dark" 
                   th:href="@{${baseUrl}(page=${pageData.number}, size=${pageData.size}, keyword=${(keyword != null and !#strings.isEmpty(keyword)) ? keyword : null}, tab=${(currentTab != null and currentTab != 'ALL') ? currentTab : null}, status=${(currentStatus != null and currentStatus != 'ALL') ? currentStatus : null}, sortBy=${sortBy}, sortDir=${sortDir})}" 
                   title="Trang trước">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>

            <!-- Dải số trang thông minh (Sliding window) -->
            <!-- Start page & End page calculation -->
            <th:block th:with="start=${pageData.number > 2 ? pageData.number - 2 : 0}, 
                              end=${(pageData.number + 2 < pageData.totalPages) ? pageData.number + 2 : pageData.totalPages - 1}">
                
                <!-- Dấu ... ở đầu nếu start > 0 -->
                <li class="page-item disabled" th:if="${start > 0}">
                    <span class="page-link text-muted">...</span>
                </li>

                <!-- Vòng lặp các trang trong dải -->
                <li th:each="i : ${#numbers.sequence(start, end)}" 
                    class="page-item" 
                    th:classappend="${i == pageData.number} ? 'active' : ''">
                    <a class="page-link" 
                       th:classappend="${i == pageData.number} ? 'bg-success border-success text-white fw-bold' : 'text-dark'"
                       th:href="@{${baseUrl}(page=${i + 1}, size=${pageData.size}, keyword=${(keyword != null and !#strings.isEmpty(keyword)) ? keyword : null}, tab=${(currentTab != null and currentTab != 'ALL') ? currentTab : null}, status=${(currentStatus != null and currentStatus != 'ALL') ? currentStatus : null}, sortBy=${sortBy}, sortDir=${sortDir})}"
                       th:text="${i + 1}">1</a>
                </li>

                <!-- Dấu ... ở cuối nếu end < totalPages - 1 -->
                <li class="page-item disabled" th:if="${end < pageData.totalPages - 1}">
                    <span class="page-link text-muted">...</span>
                </li>
            </th:block>

            <!-- Nút trang kế tiếp (Next) -->
            <li class="page-item" th:classappend="${!pageData.hasNext()} ? 'disabled' : ''">
                <a class="page-link text-dark" 
                   th:href="@{${baseUrl}(page=${pageData.number + 2}, size=${pageData.size}, keyword=${(keyword != null and !#strings.isEmpty(keyword)) ? keyword : null}, tab=${(currentTab != null and currentTab != 'ALL') ? currentTab : null}, status=${(currentStatus != null and currentStatus != 'ALL') ? currentStatus : null}, sortBy=${sortBy}, sortDir=${sortDir})}" 
                   title="Trang kế tiếp">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>

            <!-- Nút đến trang cuối (Last) -->
            <li class="page-item" th:classappend="${pageData.last} ? 'disabled' : ''">
                <a class="page-link text-dark" 
                   th:href="@{${baseUrl}(page=${pageData.totalPages}, size=${pageData.size}, keyword=${(keyword != null and !#strings.isEmpty(keyword)) ? keyword : null}, tab=${(currentTab != null and currentTab != 'ALL') ? currentTab : null}, status=${(currentStatus != null and currentStatus != 'ALL') ? currentStatus : null}, sortBy=${sortBy}, sortDir=${sortDir})}" 
                   title="Trang cuối">
                    <i class="bi bi-chevron-double-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
