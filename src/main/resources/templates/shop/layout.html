<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, activeMenu, content)"
      th:classappend="${activeMenu == 'orders'} ? 'shop-orders-document' : ''">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">BetaFruit</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- BetaFruit Shop CSS -->
    <link rel="stylesheet" th:href="@{/css/shop.css(v=7)}" href="/css/shop.css?v=7">
</head>
<body class="shop-portal-body" th:classappend="${activeMenu == 'orders'} ? 'shop-orders-portal' : ''">

    <div class="shop-shell">
        <!-- ════════ SIDEBAR CHUYỂN TRANG CỐ ĐỊNH ════════ -->
        <div th:replace="~{shop/fragments/sidebar :: sidebar(${activeMenu})}"></div>

        <!-- ════════ KHU VỰC NỘI DUNG CHÍNH (OUTLET) ════════ -->
        <div class="shop-main-pane">
            <!-- Topbar điều hướng & tài khoản -->
            <div th:replace="~{shop/fragments/topbar :: topbar}"></div>

            <!-- Main Page Outlet Area -->
            <main class="shop-content-outlet">
                <!-- Flash Notification Messages (Duy nhất tại layout để tránh bị lặp) -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm rounded-3 mb-4 d-flex align-items-center" role="alert">
                    <i class="bi bi-check-circle-fill me-2 fs-5 text-success"></i>
                    <span class="fw-medium" th:text="${successMessage}">Thao tác thành công!</span>
                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3 mb-4 d-flex align-items-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5 text-danger"></i>
                    <span class="fw-medium" th:text="${errorMessage}">Đã xảy ra lỗi!</span>
                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- ════ NƠI NHÚNG NỘI DUNG CỦA TỪNG TRANG CON (TƯƠNG ĐƯƠNG OUTLET TRONG REACT) ════ -->
                <div th:replace="${content}"></div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
