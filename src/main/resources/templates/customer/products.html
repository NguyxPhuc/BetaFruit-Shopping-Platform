<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm | BetaFruit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}" href="/css/site.css">
    <link rel="stylesheet" th:href="@{/css/customer-products.css}" href="/css/customer-products.css">
</head>
<body style="background-color: #f8f9fa;">

<div th:replace="~{fragments/header :: header}"></div>

<main class="bf-customer-container">
    <h1 class="bf-page-title">Danh sách sản phẩm</h1>
    <p class="bf-page-subtitle">Tìm kiếm và lọc trái cây</p>
    <p th:if="${errorMessage}" th:text="${errorMessage}" role="alert" style="color: #b91c1c;"></p>

    <div class="bf-catalog-layout">
        <aside class="bf-filter-card">
            <h2 class="bf-filter-title">Bộ lọc</h2>

            <form id="filterForm" th:action="@{/products}" method="get">
                <input type="hidden" name="sortBy" th:value="${filter.sortBy}" id="hiddenSortBy" />
                <input type="hidden" name="page" value="1" />

                <div class="bf-filter-section">
                    <label class="bf-filter-label" for="keywordInput">Từ khóa</label>
                    <input type="text"
                           id="keywordInput"
                           name="keyword"
                           class="bf-filter-input"
                           placeholder="Tìm..."
                           th:value="${filter.keyword}" />
                </div>

                <div class="bf-filter-section">
                    <span class="bf-filter-label">Danh mục</span>
                    <div class="bf-radio-group">
                        <label class="bf-radio-label">
                            <input type="radio"
                                   name="categoryId"
                                   value=""
                                   th:checked="${filter.categoryId == null}"
                                   onchange="submitFilter()" />
                            <span>Tất cả</span>
                        </label>

                        <label class="bf-radio-label" th:each="cat : ${pageData.categories}">
                            <input type="radio"
                                   name="categoryId"
                                   th:value="${cat.categoryId}"
                                   th:checked="${filter.categoryId != null && filter.categoryId == cat.categoryId}"
                                   onchange="submitFilter()" />
                            <span th:text="${cat.categoryName}">Trái cây Việt</span>
                        </label>
                    </div>
                </div>

                <div class="bf-filter-section">
                    <span class="bf-filter-label">Khoảng giá</span>
                    <div class="bf-price-display">
                        <span th:text="${filter.minPrice != null ? filter.minPrice + 'đ' : '0đ'}">0đ</span>
                        <span> - </span>
                        <span th:text="${filter.maxPrice != null ? filter.maxPrice + 'đ' : '500.000đ'}">500.000đ</span>
                    </div>
                    <div class="bf-price-inputs">
                        <input type="number"
                               name="minPrice"
                               id="minPriceInput"
                               placeholder="Từ đ"
                               step="10000"
                               min="0"
                               th:value="${filter.minPrice}" />
                        <span>-</span>
                        <input type="number"
                               name="maxPrice"
                               id="maxPriceInput"
                               placeholder="Đến đ"
                               step="10000"
                               min="0"
                               th:value="${filter.maxPrice}" />
                    </div>
                </div>

                <div class="bf-filter-section">
                    <span class="bf-filter-label">Đánh giá</span>
                    <div class="bf-radio-group">
                        <label class="bf-radio-label">
                            <input type="radio"
                                   name="rating"
                                   value=""
                                   th:checked="${filter.rating == null}"
                                   onchange="submitFilter()" />
                            <span>Tất cả</span>
                        </label>
                        <label class="bf-radio-label">
                            <input type="radio"
                                   name="rating"
                                   value="5"
                                   th:checked="${filter.rating != null && filter.rating == 5}"
                                   onchange="submitFilter()" />
                            <span class="bf-stars">★★★★★</span>
                        </label>
                        <label class="bf-radio-label">
                            <input type="radio"
                                   name="rating"
                                   value="4"
                                   th:checked="${filter.rating != null && filter.rating == 4}"
                                   onchange="submitFilter()" />
                            <span><span class="bf-stars">★★★★</span><span style="color:#d1d5db;">★</span> trở lên</span>
                        </label>
                        <label class="bf-radio-label">
                            <input type="radio"
                                   name="rating"
                                   value="3"
                                   th:checked="${filter.rating != null && filter.rating == 3}"
                                   onchange="submitFilter()" />
                            <span><span class="bf-stars">★★★</span><span style="color:#d1d5db;">★★</span> trở lên</span>
                        </label>
                    </div>
                </div>

                <div class="bf-filter-section">
                    <span class="bf-filter-label">Tình trạng hàng</span>
                    <div class="bf-radio-group">
                        <label class="bf-radio-label">
                            <input type="radio"
                                   name="availability"
                                   value="all"
                                   th:checked="${filter.availability == null || filter.availability == 'all' || filter.availability == ''}"
                                   onchange="submitFilter()" />
                            <span>Tất cả</span>
                        </label>
                        <label class="bf-radio-label">
                            <input type="radio"
                                   name="availability"
                                   value="in_stock"
                                   th:checked="${filter.availability == 'in_stock'}"
                                   onchange="submitFilter()" />
                            <span>Còn hàng</span>
                        </label>
                        <label class="bf-radio-label">
                            <input type="radio"
                                   name="availability"
                                   value="out_of_stock"
                                   th:checked="${filter.availability == 'out_of_stock'}"
                                   onchange="submitFilter()" />
                            <span>Hết hàng</span>
                        </label>
                    </div>
                </div>

                <div class="bf-filter-actions">
                    <button type="submit" class="bf-btn-primary">Áp dụng lọc</button>
                    <a th:href="@{/products}" class="bf-btn-secondary">Xóa bộ lọc</a>
                </div>
            </form>
        </aside>

        <section class="bf-catalog-main">
            <div class="bf-catalog-toolbar">
                <div class="bf-product-count" th:text="${pageData.totalProducts} + ' sản phẩm'">24 sản phẩm</div>

                <div style="display: flex; align-items: center; gap: 8px;">
                    <label for="sortSelect" style="font-size: 14px; color: var(--bf-text-muted);">Sắp xếp:</label>
                    <select id="sortSelect" class="bf-sort-select" onchange="changeSort(this.value)">
                        <option value="newest" th:selected="${filter.sortBy == null || filter.sortBy == 'newest'}">Mới nhất</option>
                        <option value="bestseller" th:selected="${filter.sortBy == 'bestseller'}">Bán chạy</option>
                        <option value="price_asc" th:selected="${filter.sortBy == 'price_asc'}">Giá tăng dần</option>
                        <option value="price_desc" th:selected="${filter.sortBy == 'price_desc'}">Giá giảm dần</option>
                        <option value="rating_desc" th:selected="${filter.sortBy == 'rating_desc'}">Đánh giá cao nhất</option>
                    </select>
                </div>
            </div>

            <div class="bf-product-grid" th:if="${!#lists.isEmpty(pageData.products)}">
                <article class="bf-product-card" th:each="product : ${pageData.products}">
                    <a th:href="@{/products/{id}(id=${product.productId})}" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%;">
                        <div class="bf-product-img-box">
                            <img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                                 th:src="${product.imageUrl}"
                                 th:alt="${product.productName}"
                                 loading="lazy" />
                            <span th:unless="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                                  class="bf-img-placeholder-text">Ảnh sản phẩm</span>
                            <span th:if="${!product.inStock}" class="bf-stock-badge">Hết hàng</span>
                        </div>
                        <div class="bf-product-title" th:text="${product.productName}">Táo Envy</div>
                        <div class="bf-product-price" th:text="${product.formattedPrice}">180.000đ / kg</div>
                        <div class="bf-product-rating">
                            <span class="bf-stars" th:text="${#strings.repeat('★', product.fullStars) + #strings.repeat('☆', 5 - product.fullStars)}">☆☆☆☆☆</span>
                            <span th:if="${product.reviewCount == 0}">Chưa có đánh giá</span>
                            <span th:if="${product.reviewCount != null && product.reviewCount > 0}"
                                  style="font-size: 12px; color: var(--bf-text-muted); margin-left: 4px;"
                                  th:text="'(' + ${product.reviewCount} + ')'"></span>
                        </div>
                    </a>
                </article>
            </div>

            <div class="bf-empty-catalog" th:if="${#lists.isEmpty(pageData.products)}">
                <p>Không tìm thấy sản phẩm trái cây nào phù hợp với bộ lọc hiện tại.</p>
                <a th:href="@{/products}" class="bf-btn-secondary">Xem tất cả sản phẩm</a>
            </div>

            <nav class="bf-pagination" th:if="${pageData.totalPages > 1}" aria-label="Phân trang">
                <a th:if="${pageData.currentPage > 1}"
                   th:href="@{/products(keyword=${filter.keyword}, categoryId=${filter.categoryId}, minPrice=${filter.minPrice}, maxPrice=${filter.maxPrice}, rating=${filter.rating}, availability=${filter.availability}, sortBy=${filter.sortBy}, page=${pageData.currentPage - 1})}"
                   class="bf-page-btn"
                   aria-label="Trang trước">«</a>

                <th:block th:if="${pageData.totalPages >= 1}" th:each="pageNum : ${#numbers.sequence(1, pageData.totalPages)}">
                    <a th:href="@{/products(keyword=${filter.keyword}, categoryId=${filter.categoryId}, minPrice=${filter.minPrice}, maxPrice=${filter.maxPrice}, rating=${filter.rating}, availability=${filter.availability}, sortBy=${filter.sortBy}, page=${pageNum})}"
                       th:text="${pageNum}"
                       class="bf-page-btn"
                       th:classappend="${pageNum == pageData.currentPage ? 'active' : ''}">1</a>
                </th:block>

                <a th:if="${pageData.currentPage < pageData.totalPages}"
                   th:href="@{/products(keyword=${filter.keyword}, categoryId=${filter.categoryId}, minPrice=${filter.minPrice}, maxPrice=${filter.maxPrice}, rating=${filter.rating}, availability=${filter.availability}, sortBy=${filter.sortBy}, page=${pageData.currentPage + 1})}"
                   class="bf-page-btn"
                   aria-label="Trang sau">»</a>
            </nav>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    function submitFilter() {
        document.getElementById('filterForm').submit();
    }

    function changeSort(val) {
        document.getElementById('hiddenSortBy').value = val;
        document.getElementById('filterForm').submit();
    }
</script>

</body>
</html>
