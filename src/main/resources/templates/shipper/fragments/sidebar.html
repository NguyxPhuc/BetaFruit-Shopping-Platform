<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="deliverer-sidebar" th:fragment="sidebar(active)" aria-label="Điều hướng nhân viên giao hàng">
    <a class="deliverer-sidebar__brand" href="/shipper/orders" th:href="@{/shipper/orders}" aria-label="BetaFruit — Đơn giao hàng">
        <span class="deliverer-sidebar__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 7.2c-1.1-1.6-3-2.4-4.8-2.1-2.5.4-4.1 2.9-3.5 5.3.8 3.6 4.8 6.8 8.3 8.5 3.5-1.7 7.5-4.9 8.3-8.5.6-2.4-1-4.9-3.5-5.3-1.8-.3-3.7.5-4.8 2.1Z"/><path d="M12 7.2c.2-1.8 1.1-3 2.7-3.8"/></svg>
        </span>
        <span>BetaFruit</span>
    </a>

    <nav class="deliverer-sidebar__nav" aria-label="Giao hàng và thu hộ">
        <a class="deliverer-sidebar__link" href="/shipper/orders" th:href="@{/shipper/orders}"
           th:classappend="${active == 'orders'} ? ' deliverer-sidebar__link--active' : ''"
           th:attr="aria-current=${active == 'orders' ? 'page' : null}"
           aria-label="Đơn giao hàng" title="Đơn giao hàng">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v11H3zM14 10h4l3 4v3h-7"/><path d="M14 14h7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            <span>Đơn giao hàng</span>
        </a>
        <a class="deliverer-sidebar__link" href="/shipper/orders?paymentMethod=COD&amp;status=DELIVERED" th:href="@{/shipper/orders(paymentMethod=COD,status=DELIVERED)}"
           th:classappend="${active == 'cod'} ? ' deliverer-sidebar__link--active' : ''"
           th:attr="aria-current=${active == 'cod' ? 'page' : null}"
           aria-label="Đơn COD đã giao" title="Đơn COD đã giao">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h14v4M4 5a2 2 0 0 0 0 4h16v11H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M20 12h-5v5h5"/><circle cx="16.5" cy="14.5" r=".6"/></svg>
            <span>Đơn COD đã giao</span>
        </a>
        <a class="deliverer-sidebar__link" href="/shipper/orders/cod-history" th:href="@{/shipper/orders/cod-history}"
           th:classappend="${active == 'cod-history'} ? ' deliverer-sidebar__link--active' : ''"
           th:attr="aria-current=${active == 'cod-history' ? 'page' : null}"
           aria-label="Ví nợ &amp; Lịch sử COD" title="Ví nợ &amp; Lịch sử COD">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="14" x="3" y="5" rx="2"/><path d="M7 15h4M17 12h.01M3 10h18"/></svg>
            <span>Ví nợ &amp; Lịch sử COD</span>
        </a>
        <a class="deliverer-sidebar__link" href="javascript:void(0)" onclick="toggleDelivererNotifDropdown(event)"
           aria-label="Thông báo tài xế" title="Thông báo tài xế">
            <div style="position: relative; display: inline-flex; align-items: center;">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="deliverer-sidebar-badge"
                      th:if="${globalUnreadCount != null && globalUnreadCount > 0}"
                      th:text="${globalUnreadCount > 99 ? '99+' : globalUnreadCount}">0</span>
            </div>
            <span>Thông báo</span>
        </a>
    </nav>

    <div class="deliverer-sidebar__profile">
        <img class="deliverer-sidebar__avatar" th:if="${not #strings.isEmpty(delivererAvatar)}"
             th:src="${delivererAvatar}" alt="Ảnh đại diện nhân viên giao hàng">
        <span class="deliverer-sidebar__avatar deliverer-sidebar__avatar--fallback"
              th:if="${#strings.isEmpty(delivererAvatar)}" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
        </span>
        <div class="deliverer-sidebar__identity">
            <strong th:text="${#strings.isEmpty(delivererName) ? 'Nhân viên giao hàng' : delivererName}">Nhân viên giao hàng</strong>
            <small>Giao hàng &amp; thu hộ</small>
        </div>
    </div>
</aside>

<style th:fragment="sidebar-styles">
    .deliverer-sidebar { box-sizing: border-box; display: flex; flex: 0 0 232px; flex-direction: column; width: 232px; min-height: 100vh; min-height: 100dvh; padding: 32px 18px 28px; background: #102e5a; color: #9eb4cf; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .deliverer-sidebar *, .deliverer-sidebar *::before, .deliverer-sidebar *::after { box-sizing: border-box; }
    .deliverer-sidebar__brand { display: inline-flex; align-items: center; gap: 10px; margin: 0 12px 39px; color: #eaf3ff; font-size: 17px; font-weight: 700; text-decoration: none; }
    .deliverer-sidebar__logo { display: grid; width: 34px; height: 34px; flex-shrink: 0; place-items: center; border-radius: 8px; background: #3671ff; color: #fff; }
    .deliverer-sidebar__logo svg { width: 19px; height: 19px; fill: currentColor; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .deliverer-sidebar__nav { display: grid; gap: 6px; margin-bottom: 32px; }
    .deliverer-sidebar__link { display: flex; align-items: center; gap: 13px; min-height: 44px; padding: 10px 14px; border-radius: 9px; color: inherit; font-size: 14px; font-weight: 500; line-height: 1.4; text-decoration: none; transition: background .18s ease, color .18s ease; }
    .deliverer-sidebar__link:hover { background: rgba(255,255,255,.08); color: #fff; }
    .deliverer-sidebar__link--active, .deliverer-sidebar__link--active:hover { background: #3671ff; box-shadow: 0 8px 18px rgba(22,68,172,.35); color: #fff; }
    .deliverer-sidebar__link:focus-visible, .deliverer-sidebar__brand:focus-visible { outline: 2px solid #b9d5ff; outline-offset: 4px; }
    .deliverer-sidebar__link svg { width: 20px; height: 20px; flex: 0 0 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .deliverer-sidebar-badge {
        position: absolute;
        top: -6px;
        right: -8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 9999px;
        background: #ef4444;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        border: 2px solid #102e5a;
    }
    .deliverer-sidebar__profile { display: flex; align-items: center; gap: 11px; margin-top: auto; padding: 24px 10px 0; border-top: 1px solid rgba(178,201,229,.16); }
    .deliverer-sidebar__avatar { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; object-fit: cover; }
    .deliverer-sidebar__avatar--fallback { display: grid; place-items: center; background: #264975; color: #dceaff; }
    .deliverer-sidebar__avatar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
    .deliverer-sidebar__identity { min-width: 0; }
    .deliverer-sidebar__identity strong { display: block; overflow-wrap: anywhere; color: #eaf3ff; font-size: 13px; line-height: 1.4; }
    .deliverer-sidebar__identity small { display: block; margin-top: 3px; color: #9eb4cf; font-size: 11px; }
    @media (max-width: 700px) {
        .deliverer-sidebar { flex-basis: 72px; width: 72px; padding-inline: 10px; }
        .deliverer-sidebar__brand { margin-inline: 9px; }
        .deliverer-sidebar__brand > span:last-child, .deliverer-sidebar__link span:last-child, .deliverer-sidebar__identity { display: none; }
        .deliverer-sidebar__link { justify-content: center; padding-inline: 0; }
        .deliverer-sidebar__profile { justify-content: center; padding-inline: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .deliverer-sidebar__link { transition: none; } }
</style>
</body>
</html>
