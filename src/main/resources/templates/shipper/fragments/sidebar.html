<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="deliverer-sidebar" th:fragment="sidebar(active)" aria-label="Điều hướng nhân viên giao hàng">
    <a class="deliverer-sidebar__brand" href="/shipper/orders" th:href="@{/shipper/orders}" aria-label="BetaFruit — Đơn giao hàng">
        <span class="deliverer-sidebar__logo"><img src="/images/betafruit-logo.png" th:src="@{/images/betafruit-logo.png}" alt="BetaFruit"></span>
    </a>

    <nav class="deliverer-sidebar__nav" aria-label="Giao hàng và thu hộ">
        <div class="deliverer-sidebar__group-title">Giao hàng &amp; thu hộ</div>
        <a class="deliverer-sidebar__link" href="/shipper/orders" th:href="@{/shipper/orders}"
           th:classappend="${active == 'orders'} ? ' deliverer-sidebar__link--active' : ''"
           th:attr="aria-current=${active == 'orders' ? 'page' : null}"
           aria-label="Đơn giao hàng" title="Đơn giao hàng">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v11H3zM14 10h4l3 4v3h-7"/><path d="M14 14h7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            <span>Đơn giao hàng</span>
        </a>
        <a class="deliverer-sidebar__link" href="/shipper/orders?paymentMethod=COD&amp;status=DELIVERED" th:href="@{/shipper/orders(paymentMethod=COD,status=DELIVERED)}"
           th:classappend="${active == 'cod'} ? ' deliverer-sidebar__link--active' : ''"
           th:attr="aria-current=${active == 'cod' ? 'page' : null}"
           aria-label="Đơn COD đã giao" title="Đơn COD đã giao">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h14v4M4 5a2 2 0 0 0 0 4h16v11H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M20 12h-5v5h5"/><circle cx="16.5" cy="14.5" r=".6"/></svg>
            <span>Đơn COD đã giao</span>
        </a>
        <a class="deliverer-sidebar__link" href="/shipper/orders/cod-history" th:href="@{/shipper/orders/cod-history}"
           th:classappend="${active == 'cod-history'} ? ' deliverer-sidebar__link--active' : ''"
           th:attr="aria-current=${active == 'cod-history' ? 'page' : null}"
           aria-label="Ví nợ &amp; Lịch sử COD" title="Ví nợ &amp; Lịch sử COD">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="14" x="3" y="5" rx="2"/><path d="M7 15h4M17 12h.01M3 10h18"/></svg>
            <span>Ví nợ &amp; Lịch sử COD</span>
        </a>
        <a class="deliverer-sidebar__link" href="javascript:void(0)" onclick="toggleDelivererNotifDropdown(event)"
           aria-label="Thông báo tài xế" title="Thông báo tài xế">
            <div style="position: relative; display: inline-flex; align-items: center;">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="deliverer-sidebar-badge"
                      th:if="${globalUnreadCount != null && globalUnreadCount > 0}"
                      th:text="${globalUnreadCount > 99 ? '99+' : globalUnreadCount}">0</span>
            </div>
            <span>Thông báo</span>
        </a>
    </nav>

    <div class="deliverer-sidebar__footer">
    <div class="deliverer-sidebar__profile">
        <img class="deliverer-sidebar__avatar" th:if="${not #strings.isEmpty(delivererAvatar)}"
             th:src="${delivererAvatar}" alt="Ảnh đại diện nhân viên giao hàng">
        <span class="deliverer-sidebar__avatar deliverer-sidebar__avatar--fallback"
              th:if="${#strings.isEmpty(delivererAvatar)}" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
        </span>
        <div class="deliverer-sidebar__identity">
            <strong th:text="${not #strings.isEmpty(delivererName) ? delivererName : (not #strings.isEmpty(session.LOGGED_IN_FULLNAME) ? session.LOGGED_IN_FULLNAME : (session.LOGGED_IN_USERNAME ?: 'Nhân viên giao hàng'))}">Nhân viên giao hàng</strong>
            <small th:if="${not #strings.isEmpty(session.LOGGED_IN_USERNAME)}" th:text="'@' + ${session.LOGGED_IN_USERNAME}"></small>
            <small class="deliverer-sidebar__role">Nhân viên giao hàng</small>
        </div>
    </div>
    <a class="deliverer-sidebar__store" href="/home" th:href="@{/home}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 7-5 5 5 5M5 12h14"/></svg><span>Về Sàn BetaFruit</span>
    </a>
    <a class="deliverer-sidebar__logout" href="/auth/logout" th:href="@{/auth/logout}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v16h5M10 12h10m-4-4 4 4-4 4"/></svg><span>Đăng xuất tài khoản</span>
    </a>
    </div>
</aside>

<style th:fragment="sidebar-styles">
    .deliverer-sidebar { box-sizing: border-box; display: flex; flex: 0 0 265px; flex-direction: column; width: 265px; height: 100vh; height: 100dvh; position: sticky; top: 0; overflow-y: auto; background: linear-gradient(180deg, #181513 0%, #221c17 100%); color: #e2dcd5; border-right: 1px solid rgba(255,255,255,.05); box-shadow: 4px 0 24px rgba(0,0,0,.18); font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .deliverer-sidebar *, .deliverer-sidebar *::before, .deliverer-sidebar *::after { box-sizing: border-box; }
    .deliverer-sidebar__brand { display: block; padding: 14px 16px 11px; border-bottom: 1px solid rgba(255,255,255,.08); text-decoration: none; }
    .deliverer-sidebar__logo { display: flex; align-items: center; justify-content: center; width: 100%; padding: 6px 12px; border-radius: 12px; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.22); }
    .deliverer-sidebar__logo img { display: block; height: 34px; max-width: 100%; object-fit: contain; }
    .deliverer-sidebar__nav { display: grid; gap: 6px; padding: 18px 10px 24px; }
    .deliverer-sidebar__group-title { padding: 0 12px 8px; color: #a89f91; font-size: 10px; font-weight: 700; line-height: 1.5; letter-spacing: .8px; text-transform: uppercase; }
    .deliverer-sidebar__link { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border-left: 3.5px solid transparent; border-radius: 8px; color: inherit; font-size: 13.6px; font-weight: 500; line-height: 1.4; text-decoration: none; transition: background .15s ease, color .15s ease; }
    .deliverer-sidebar__link svg { width: 20px; height: 20px; flex: 0 0 20px; color: #fdba74; }
    .deliverer-sidebar__link:hover { background: rgba(255,255,255,.08); color: #fff; }
    .deliverer-sidebar__link:hover svg { color: #f97316; }
    .deliverer-sidebar__link--active, .deliverer-sidebar__link--active:hover { background: linear-gradient(90deg, rgba(234,88,12,.28) 0%, rgba(249,115,22,.12) 100%); border-left-color: #f97316; color: #fff; font-weight: 700; }
    .deliverer-sidebar__link--active svg { color: #fb923c; }
    .deliverer-sidebar a:focus-visible { outline: 2px solid #fb923c; outline-offset: -2px; }
    .deliverer-sidebar svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .deliverer-sidebar__footer { margin-top: auto; padding: 16px 12px 12px; border-top: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.25); }
    .deliverer-sidebar__profile { display: flex; align-items: center; gap: 11px; margin-bottom: 18px; padding: 0 4px; }
    .deliverer-sidebar__avatar { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; object-fit: cover; }
    .deliverer-sidebar__avatar--fallback { display: grid; place-items: center; background: rgba(249,115,22,.16); color: #fdba74; border: 1px solid rgba(249,115,22,.25); }
    .deliverer-sidebar__avatar svg { width: 22px; height: 22px; }
    .deliverer-sidebar-badge {
        position: absolute;
        top: -6px;
        right: -8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 9999px;
        background: #ef4444;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        border: 2px solid #221c17;
    }
    .deliverer-sidebar__identity { min-width: 0; }
    .deliverer-sidebar__identity strong { display: block; overflow-wrap: anywhere; color: #fff; font-size: 13px; line-height: 1.5; }
    .deliverer-sidebar__identity small { display: block; overflow-wrap: anywhere; margin-top: 2px; color: #a89f91; font-size: 11px; line-height: 1.5; }
    .deliverer-sidebar__identity .deliverer-sidebar__role { color: #fdba74; }
    .deliverer-sidebar__store, .deliverer-sidebar__logout { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 9px 12px; border-radius: 12px; text-decoration: none; font-size: 12.8px; font-weight: 600; line-height: 1.4; transition: background .15s ease, color .15s ease; }
    .deliverer-sidebar__store svg, .deliverer-sidebar__logout svg { width: 18px; height: 18px; flex-shrink: 0; }
    .deliverer-sidebar__store { margin-bottom: 8px; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.18); }
    .deliverer-sidebar__store:hover { background: #fff; color: #c2410c; }
    .deliverer-sidebar__logout { background: rgba(239,68,68,.18); color: #fca5a5; border: 1.5px solid rgba(248,113,113,.45); font-weight: 700; }
    .deliverer-sidebar__logout:hover { background: #ef4444; border-color: #ef4444; color: #fff; }
    @media (max-width: 700px) {
        .deliverer-layout { flex-direction: column; }
        .deliverer-sidebar { position: static; flex: 0 0 auto; width: 100%; height: auto; overflow: visible; }
        .deliverer-sidebar__brand { padding: 12px 16px; }
        .deliverer-sidebar__logo { width: fit-content; }
        .deliverer-sidebar__logo img { height: 28px; }
        .deliverer-sidebar__nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
        .deliverer-sidebar__group-title { display: none; }
        .deliverer-sidebar__link { flex: 1 1 auto; justify-content: center; font-size: 12px; padding-inline: 8px; }
        .deliverer-sidebar__footer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; }
        .deliverer-sidebar__profile { flex: 1 1 100%; margin-bottom: 2px; }
        .deliverer-sidebar__store, .deliverer-sidebar__logout { flex: 1 1 auto; margin: 0; font-size: 12px; padding-inline: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { .deliverer-sidebar a { transition: none; } }
</style>
</body>
</html>
