spring.application.name=SWP391_BetaFruit

#Config port
server.port=8080

# Checkout: fee per shop order, in VND; fallback commission percentage when shop rate is null.
checkout.shipping-fee=${CHECKOUT_SHIPPING_FEE:0}
checkout.default-commission-rate=${CHECKOUT_DEFAULT_COMMISSION_RATE:0}

#Config SQL
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Config JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#Config thymeleaf
spring.thymeleaf.cache=false

#Config email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# VNPAY Configuration
vnpay.tmnCode=${VNPAY_TMNCODE:}
vnpay.hashSecret=${VNPAY_HASHSECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:/payment/vnpay-return}

spring.config.import=optional:classpath:application-local.properties

# Minio Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:betafruit-media}

# Config file size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size= 5MB
spring.servlet.multipart.max-request-size= 25MB
spring.servlet.multipart.file-size-threshold= 2MB