# Isolated integration-test configuration. Never import the runtime/local datasource.
spring.application.name=BetaFruit-integration-tests
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:betafruit_full_context;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.mail.host=127.0.0.1
spring.mail.port=2525
spring.mail.test-connection=false
vnpay.tmnCode=TEST_ONLY
vnpay.hashSecret=test-only-signature-key
vnpay.url=https://example.invalid/vnpay
vnpay.returnUrl=/payment/vnpay-return
